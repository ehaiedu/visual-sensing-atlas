d":"task"}],"result_boundary":"正文、图注与 Methods 对部分准确率的“训练/测试”称呼存在差异，此处保留 Methods 口径。硬件状态逐点读出，不能写成整套网络全硬件或普遍 100%。"},"hardware":{"device":"5×5 ITO / ZnO / Nb 掺杂 SrTiO₃（NSTO）光忆阻器阵列。","property":"光刺激引发电流变化；撤光后电流缓慢衰减，多次刺激的幅值和间隔影响当前状态。氧空位相关过程调节 ZnO/NSTO 肖特基势垒。","scale":"5×5实测；48×48交通例为模型仿真","level":"器件／阵列","memory":"短时动态记忆；保存的是输入历史形成的状态，而不是读出 ANN 的全部权重。","mapping":[{"step":"历史输入编码与动态状态更新","property":"光响应累积 + 撤光后衰退记忆","part":"储备池的时间特征 / 状态 h₃","where":"实际光忆阻器"},{"step":"状态采集与数据准备","property":"读出 25 个器件的电流","part":"储备池输出向量","where":"测量系统逐点采集；外部加噪"},{"step":"类别判定与权重学习","property":"不由该光忆阻阵列实现","part":"ANN 读出网络，25 输入 → 3 输出","where":"外部软件"}],"outside":"光脉冲与掩模输入、偏置、逐点电流测量，以及 ANN 训练和类别判定依赖外围系统 / 软件。","contribution":"在感知时保留运动历史，为外部分类器生成时间特征，替代显式逐帧历史特征的部分构造。","hardware_metrics":"本例的“存”是短时动态状态；器件响应速度不等于整个运动分类决策延迟。"},"status":"器件状态实测＋软件分类","gaps":[],"figure_numbers":[3],"figures":[{"label":"Fig. 3","figure_number":3,"local_path":"assets/media/figures/T02-Fig3.png","url":"https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41467-023-37886-y/MediaObjects/41467_2023_37886_Fig3_HTML.png","page":"https://www.nature.com/articles/s41467-023-37886-y/figures/3","width":1995,"height":1358,"bytes":236443,"sha256":"f3ca124e2bc9b6f1884f08e85ebab8d7b595d59b916859d3d211d558ed63fa60","thumbnail":"assets/media/thumbs/T02-Fig3.webp","media_role":"论文原图","caption":"Fig. 3: Motion recognition and prediction.","provenance":"来源为出版方的论文图版，已按原文图号核对。"}],"videos":[],"sources":[{"label":"原论文 · Fig. 3a–e；Methods: Readout network for video recognition of motion","url":"https://www.nature.com/articles/s41467-023-37886-y"}],"publication":{"title":"Dynamic machine vision with retinomorphic photomemristor-reservoir computing","venue":"Nature Communications","venue_full":"Nature Communications","venue_type":"期刊","year":2023,"date":"2023-04-15","date_precision":"day","date_basis":"首次在线发表","doi":"10.1038/s41467-023-37886-y","url":"https://www.nature.com/articles/s41467-023-37886-y"},"sort_date": function localMedia(value) {
  if (typeof value !== 'string') return '';
  if (/^data:(?:image\/(?:jpeg|png|webp|gif)|video\/mp4);base64,/i.test(value)) return value;
  if (value.startsWith('assets/') && !value.includes('..') && !/[\\?#]/.test(value)) return value;
  return '';
}

function mediaStats(rows) {
  const images = new Set(), videos = new Set(), localVideos = new Set();
  for (const app of rows) {
    for (const fig of app.figures) if (localMedia(fig.local_path)) images.add(fig.local_path);
    for (const video of app.videos) {
      videos.add(video.url);
      if (localMedia(video.local_path)) localVideos.add(video.url);
    }
  }
  return {images: images.size, videos: videos.size, localVideos: localVideos.size};
}

function hasMedia(app, choice) {
  if (choice === 'image') return app.figures.some(f => localMedia(f.local_path));
  if (choice === 'missing') return !app.figures.some(f => localMedia(f.local_path));
  if (choice === 'video') return app.videos.length > 0;
  if (choice === 'local-video') return app.videos.some(v => localMedia(v.local_path));
  return true;
}

function videoSource(v) {
  const match = /^https:\/\/(?:www\.)?(?:youtube\.com|youtube-nocookie\.com)\/embed\/([\w-]+)/i.exec(v.url || '');
  return match ? 'https://www.youtube.com/watch?v='+match[1] : v.url;
}

function figureRole(f) {
  return f.media_role || (f.local_path ? '本地图片' : '在线图像');

function localLinks(file, type, fileName) {
  const path = localMedia(file);
  if (!path) return '';
  const download = `<a class="btn" href="${esc(path)}" download="${esc(fileName)}">下载${type}</a>`;
  if (path.startsWith('data:')) return download;
  return `<a class="btn" href="${esc(path)}" target="_blank" rel="noopener">打开本地${type} ↗</a>${download}`;
}

function figureNote(f) {

function play(key,button) {
  const sep = key.lastIndexOf(':'), app = BY_ID[key.slice(0,sep)];
  const video = app?.videos[Number(key.slice(sep+1))], src = localMedia(video?.local_path);
  if (!src) return;
  const container = button.closest('.video-card').querySelector('.video-player');
  const player = document.createElement('video');
  player.controls = true;
  player.playsInline = true;
  player.preload = 'metadata';
  player.setAttribute('aria-label',video.title);
  if (localMedia(video.poster_path)) player.poster = video.poster_path;
  player.addEventListener('error',() => {
    const msg = document.createElement('p');
    msg.className = 'video-error';
    msg.setAttribute('role','status');
    msg.textContent = '本地视频读取失败。请确认媒体文件夹完整，或打开原始视频。';
    container.replaceChildren(msg);
    button.hidden = false;
    button.textContent = '重试本地视频';
  },{once:true});
  container.replaceChildren(player);
  button.hidden = true;
  player.src = src;
  player.play().catch(() => {});
}

function bindMedia() {
  document.querySelectorAll('[data-source-image]:not([data-bound])').forEach(img=>{
    img.dataset.bound = '1';
    const loaded = () => img.parentElement.classList.add('image-loaded');
    const failed = () => {
      img.hidden = true;
      img.parentElement.classList.add('image-unavailable');
      const message = img.parentElement.querySelector('.image-placeholder strong');
      if (message) message.textContent = '图片读取失败，可查看原始来源';
    };
    img.addEventListener('load',loaded,{once:true});
    img.addEventListener('error',failed,{once:true});
    if (img.complete && img.naturalWidth) loaded();
  });
}

  frame.scrollTop = frame.scrollLeft = 0;
}
function updateHash(){const p=new URLSearchParams({group:state.group});if(state.category!=='all')p.set('category',state.category);if(state.q)p.set('q',state.q);history.replaceState(null,'','#'+state.view+'?'+p.toString());}
function closeMenu(){$('#sidebar').classList.remove('menu-open');$('#menu-shade').hidden=true;$('#menu-toggle').setAttribute('aria-expanded','false');}
function showFigure(key) {
  const sep = key.lastIndexOf(':'), a = BY_ID[key.slice(0,sep)], f = a?.figures[Number(key.slice(sep+1))];
  if (!f) return;
  const path = localMedia(f.local_path);
  const fileName = path.startsWith('assets/') ? path.split('/').pop() : `${a.paper_id}-${f.label}`;
  const notes = [...new Set([figureNote(f),f.provenance].filter(Boolean))].map(esc).join(' ');
  $('#lightbox-content').innerHTML = `<div class="lightbox-head"><div><b>${esc(figureRole(f))} · ${esc(f.label)}</b><small>${esc(a.title)}</small></div><button class="btn" data-close-lightbox aria-label="关闭图片">✕</button></div>
    <div class="lightbox-image" tabindex="0" aria-label="图片预览">${imageMarkup(f,a,'zoom')}</div>
    <p class="hintline">${esc(f.caption)}</p><p class="hintline">${notes}</p>
    <div class="video-actions">${path?'<button class="btn primary" data-zoom-native aria-pressed="false">按原始尺寸查看</button>':''}${localLinks(path,'图片',fileName)}${ext(f.page||a.publication.url,'图文来源 ↗','btn')}${f.url&&f.url!==f.page?ext(f.url,'原始素材 ↗','btn'):''}</div>`;
  $('#lightbox').showModal();
  bindMedia();
}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.category){state.category=b.dataset.category;state.limit=12;currentId=null;state.view='explore';updateHash();render();closeMenu();$('#application-list')?.scrollIntoView({block:'start'});}else if(b.dataset.figure){e.preventDefault();showFigure(b.dataset.figure);}else if(b.hasAttribute('data-zoom-native')){toggleFigureZoom(b);}else if(b.hasAttribute('data-close-lightbox')){$('#lightbox').close();}else if(b.hasAttribute('data-all-groups')){setGroup('all');}else if(b.id==='menu-toggle'){const on=$('#sidebar').classList.toggle('menu-open');$('#menu-shade').hidden=!on;b.setAttribute('aria-expanded',String(on));}else if(b.id==='menu-shade'){closeMenu();}});
document.addEventListener('change',e=>{if(e.target.id==='media-filter'){state.media=e.target.value;state.limit=12;render();}if(e.target.id==='family-filter'){state.family=e.target.value;state.limit=12;render();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {const q=$('#search');if(q){e.preventDefault();q.focus();}}if(e.key==='Escape'){closeMenu();}});
$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close();});
window.addEventListener('popstate',fromHash);


function briefBlock(number,label,text,key) {
  return `<section class="brief-block brief-${esc(key)}"><div class="block-label"><span>${number}</span><b>${esc(label)}</b></div><p data-brief="${esc(key)}">${esc(text)}</p></section>`;
}
function briefSection(key,number,label,text) {
  return `<section class="detail-section brief-detail" id="${esc(key)}"><h2><span class="sec-no mono">${number}</span>${esc(label)}</h2><div class="brief-surface"><p data-brief="${esc(key)}">${esc(text)}</p></div></section>`;
}

const headerCount = $('[data-view="media"] .tiny-count');
if (headerCount) headerCount.textContent = inventory.videos;
const footer = $('.footer');
footer.innerHTML = `<div><b>视觉感算应用图谱</b><a href="media-audit.html">媒体来源与核验清单 ↗</a></div><div>${PAPERS.length} 篇视觉论文 · ${APPS.length} 个应用<br>${inventory.images} 张本地配图 · ${inventory.localVideos} 段本地视频</div>`;
fromHash();if(!$('#main').childElementCount)render();
</script></body></html>
